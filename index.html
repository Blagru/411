<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>411班意见箱</title>
<style>
:root{--bg:#ecebe5;--paper:#fbfaf6;--ink:#24282d;--muted:#6c7178;--line:#d8d4c8;--accent:#2f5d62;--accent-d:#234a4e;--ok:#2f6f4b;--bad:#a4442f;--up:#2f9e5c;--down:#d6453d;--del:#8c1c1c;--del-d:#6b1313;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.2,1.35,.4,1);
--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .2 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{min-height:100vh;min-height:100dvh;font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg) var(--noise);font-variant-emoji:text;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.brand{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,select,label,input[type=radio],input[type=checkbox]{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 0 #fff inset,0 1px 2px rgba(40,40,30,.08),0 10px 24px -14px rgba(40,40,30,.35)}
.muted,small{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin-top:32px}

/* 动画 */
@keyframes fade{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes wiggle{25%{transform:rotate(-9deg) scale(1.1)}60%{transform:rotate(7deg) scale(1.1)}}
@keyframes votePop{0%{transform:scale(.82)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(217,180,90,.6)}to{box-shadow:0 0 0 14px rgba(217,180,90,0)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(70px)}}
@keyframes fabIn{from{opacity:0;transform:scale(.2) rotate(-90deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes leave{from{max-height:var(--h);opacity:1}to{max-height:0;opacity:0;transform:translateX(28px) scale(.97);margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0}}

/* 身份选择 */
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 18px;font-variant-emoji:emoji}
.gate-in{width:100%;max-width:860px;text-align:center}
.gate h1{font-size:clamp(28px,7.5vw,40px);letter-spacing:.2em;animation:fadeDown .6s var(--ease) backwards}
.sub{color:var(--muted);margin:10px 0 clamp(22px,5vw,36px);animation:fadeUp .6s .1s var(--ease) backwards}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.5vw,20px)}
.role{cursor:pointer;padding:38px 18px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:transform .2s var(--ease),box-shadow .2s;animation:rise .6s var(--ease) backwards;animation-delay:calc(.18s + var(--i) * .09s)}
.role .ico{font-size:42px;line-height:1;animation:float 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.9s)}
.role b{font-size:21px;font-family:"Songti SC","Noto Serif SC",serif;letter-spacing:.1em}
.role small{font-size:14px}
.role:active{transform:scale(.97)}
@media(hover:hover){
  .role:hover{transform:translateY(-4px);box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(40,40,30,.1),0 18px 30px -14px rgba(40,40,30,.45)}
  .role:hover .ico{animation:wiggle .55s ease}
}
@media(max-width:640px){
  .roles{grid-template-columns:1fr}
  .role{display:grid;grid-template-columns:56px 1fr;grid-template-areas:"i t" "i s";column-gap:14px;row-gap:0;align-items:center;justify-items:start;text-align:left;padding:16px 18px}
  .role .ico{grid-area:i;justify-self:center;font-size:34px}
  .role b{grid-area:t}
  .role small{grid-area:s}
}

/* 顶栏与布局 */
.top{position:sticky;top:0;z-index:20;background:var(--paper) var(--noise);border-bottom:1px solid var(--line);box-shadow:0 8px 16px -14px rgba(40,40,30,.55);animation:fadeDown .45s var(--ease) backwards}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));padding-top:calc(8px + env(safe-area-inset-top));color:var(--ink)}
.subbar{padding:0 max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
.sub-in{max-width:780px;margin:0 auto}
.brand{font-size:20px;letter-spacing:.15em}
.who{display:flex;align-items:center;gap:6px}
.badge{display:inline-flex;align-items:center;gap:7px;min-height:34px;border:0;background:#efe3bf;color:#5a4510;border-radius:999px;padding:2px 12px 2px 14px;font-size:14px;white-space:nowrap;cursor:pointer;transition:background .2s,transform .12s}
.badge .sw-i{display:inline-block;transition:transform .5s var(--spring)}
.badge:active{transform:scale(.94)}
.badge:active .sw-i{transform:rotate(180deg)}
.ibtn{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);font-size:21px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,transform .12s}
.ibtn:active{transform:scale(.88)}
@media(hover:hover){.badge:hover{background:#e8d8a6}.badge:hover .sw-i{transform:rotate(180deg)}.ibtn:hover{background:rgba(40,40,30,.07)}}
.bar .ghost{border:0;border-radius:10px;color:var(--ink);padding:6px 12px;white-space:nowrap}
.rot{display:inline-block}
.rot.go{animation:spin .8s linear infinite}
.wrap{max-width:780px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));animation:fade .4s .05s backwards}
#tabs{position:relative;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;padding:3px;background:#e3e0d5;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08) inset}
.tab{position:relative;z-index:1;flex:1 1 auto;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);padding:6px 14px;font-weight:600;white-space:nowrap;cursor:pointer;transition:color .25s,transform .12s}
.tab.on{color:#fff}
.ink{position:absolute;left:0;top:0;z-index:0;background:var(--accent);border-radius:9px;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 2px 5px rgba(0,0,0,.2);transition:transform .45s var(--spring),width .4s var(--ease),height .3s var(--ease)}
.ink.noanim{transition:none}
.chip{flex:none;white-space:nowrap;display:inline-flex;align-items:center;min-height:36px;border:1px solid var(--line);background:var(--paper);padding:3px 14px;font-size:14px;border-radius:999px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:background .2s,color .2s,border-color .2s,transform .12s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent-d)}
.chip i{font-style:normal;font-size:12px;opacity:.6;margin-left:6px}
/* 建议类别的浅色 */
.k0{--cbg:#fde2d3;--cfg:#9a4a22;--cbd:#f3c2a8;--cdk:#d9733f}
.k1{--cbg:#dcebf9;--cfg:#1f5a8a;--cbd:#b3d1ec;--cdk:#2f78b5}
.k2{--cbg:#ebe3f7;--cfg:#5b3f8f;--cbd:#d0c1ea;--cdk:#7a5cb5}
.k3{--cbg:#dff1e2;--cfg:#2f6a3f;--cbd:#b6dcbd;--cdk:#3f8f55}
.k4{--cbg:#d9f0ef;--cfg:#1f6a68;--cbd:#abdcd9;--cdk:#2f9591}
.k5{--cbg:#fbe1ea;--cfg:#9a3558;--cbd:#f0b9cc;--cdk:#c9507c}
.k6{--cbg:#e9e8e2;--cfg:#55585d;--cbd:#cfcdc3;--cdk:#7a7d83}
.chip.kk{background:var(--cbg);color:var(--cfg);border-color:var(--cbd)}
.chip.kk.on{background:var(--cdk);color:#fff;border-color:var(--cdk)}
.chip.kk i{opacity:.7}
#chips{position:relative;display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;padding:1px 2px 2px}
#chips::-webkit-scrollbar{display:none}
#chips:empty{display:none}
.ghost{min-height:40px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 14px;cursor:pointer;transition:background .2s,transform .12s}
.primary,.danger{min-height:44px;color:#fff;border-radius:8px;padding:9px 22px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 4px rgba(0,0,0,.18);transition:transform .12s,opacity .2s,box-shadow .2s}
.primary{background:var(--accent);border:1px solid var(--accent-d)}
.danger{background:transparent;color:var(--del);border:1px solid #dfb4ae;box-shadow:none;font-weight:600}
@media(hover:hover){.danger:hover{background:rgba(140,28,28,.09)}}
.primary:disabled,.danger:disabled{opacity:.6}
.tab:active,.chip:active,.ghost:active,.primary:active,.danger:active,.vote:active:not(:disabled),.del:active{transform:scale(.95)}
@media(hover:hover){
  .bar .ghost:hover,.modal .ghost:hover{background:rgba(40,40,30,.07)}
  .chip:not(.on):not(.kk):hover{background:#fff;border-color:#bdb8a8}
  .chip.kk:not(.on):hover{filter:brightness(.96)}
  .tab:not(.on):hover{color:var(--ink)}
  .primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 10px rgba(47,93,98,.35)}
}
.empty{text-align:center;color:var(--muted);padding:40px 0;animation:fade .5s}
.summary{color:var(--muted);font-size:14px;margin-bottom:12px}

/* 表单 */
.post,.form,.modal,.setup{padding:20px 22px}
.post{margin-bottom:10px;padding:13px 16px}
.form{animation:rise .45s var(--ease) backwards}
.form h2,.setup h2,.modal h2{font-size:22px;margin-bottom:14px}
.sym{color:var(--accent)}
label.f{display:block;margin-bottom:14px;font-weight:600}
label.f small{font-weight:400}
input[type=text],input[type=password],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid #cbc6b8;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06) inset;margin-top:6px;transition:border-color .2s,outline-color .2s}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,93,98,.35);border-color:var(--accent)}
textarea{resize:vertical;min-height:0}
input[type=radio],input[type=checkbox]{width:auto;min-height:0;margin:0;box-shadow:none}
input[type=radio]{width:20px;height:20px;accent-color:var(--accent)}
.mode{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;margin-bottom:8px;font-weight:400;transition:border-color .2s,background .2s}
.mode:has(input:checked){border-color:var(--accent);background:#eaf1f0}
.mode input{margin-top:3px;flex:none}
.mode b{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
#nameRow:not([hidden]){animation:fadeUp .3s var(--ease)}

/* 帖子 */
.post.enter{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i) * 60ms)}
.post.leaving{overflow:hidden;pointer-events:none;animation:leave .32s var(--ease) forwards}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:5px}
.meta .grow{flex:1}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:13px;background:#f1eee5;color:#4b4f55;white-space:nowrap}
.tag.empty{color:#9a9a90;border-style:dashed;padding:0 8px;animation:none}
.tag.lock{background:#f3e3df;color:var(--bad);border-color:#e2bdb4}
.tag.ok{background:#e2efe6;color:var(--ok);border-color:#b9d6c4}
.tag.kk{background:var(--cbg);color:var(--cfg);border-color:var(--cbd)}
.tag.gold{background:#f3dd8f;color:#5a4510;border-color:#dcc36d;font-weight:600}
.post.kk{border-left:5px solid var(--cbd)}
.content{white-space:pre-wrap;word-break:break-word;line-height:1.55}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;margin-top:8px;padding:2px 12px;background:#f1eee5;border:1px solid var(--line);border-radius:8px;font-size:15px}
.ctrl .cat{display:flex;align-items:center;gap:8px;flex:1 1 200px}
.ctrl select{flex:1;min-width:0;margin:0;padding:4px 10px}
.sw{display:flex;gap:10px;align-items:center;min-height:38px;cursor:pointer}
.sw input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:#cbc6b8;position:relative;cursor:pointer;transition:background .25s}
.sw input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.sw input[type=checkbox]:checked{background:var(--accent)}
.sw input[type=checkbox]:checked::after{transform:translateX(18px)}
.sw input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
.votes{display:flex;align-items:center;gap:8px}
.vote{display:inline-flex;align-items:center;gap:5px;min-height:32px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:1px 13px 1px 11px;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:background .25s,border-color .25s,transform .12s}
.votes b{font-size:12px;line-height:1}
.votes b.u{color:var(--up)}
.votes b.d{color:var(--down)}
.vote:disabled{cursor:default;opacity:.55}
.vote.on-up{background:#e2f3e8;border-color:#8ccaa3;opacity:1}
.vote.on-down{background:#fbe5e3;border-color:#e6a29c;opacity:1}
.vote.pop{animation:votePop .45s var(--spring)}
.votes.ro span{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;background:#f1eee5;border-radius:999px;font-size:13px}
.cmts{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.cm{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-left:3px solid var(--accent);background:#eaf0ee;border-radius:0 6px 6px 0;font-size:14px;line-height:1.5;animation:fadeUp .3s var(--ease) backwards;word-break:break-word}
.cm.monitor{border-left-color:#c9a24a;background:#f6efd9}
.cm.student{border-left-color:#a9a89f;background:#f0eee7}
.cm-by{font-weight:700;font-size:13px;flex:none;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm-r{margin-left:auto;flex:none;display:flex;align-items:baseline;gap:2px;padding-left:6px}
.cm-t{color:var(--muted);font-size:12px;white-space:nowrap}
.cm .del.sm{margin-left:4px;padding:0 4px;min-height:0;font-size:12px}
.cm-txt{white-space:pre-wrap;flex:1 1 auto;min-width:0}
.cm-more{align-self:flex-start;background:transparent;border:0;color:var(--accent);font-size:13px;padding:2px 4px;min-height:0;box-shadow:none;font-weight:600}
.rbar{position:absolute;left:0;right:0;top:-2px;bottom:-2px;z-index:3;display:flex;align-items:center;gap:6px;padding:0 4px;background:var(--paper);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 3px 10px rgba(36,40,45,.12);transform-origin:right center;animation:rbIn .26s var(--ease)}
.rbar.noanim{animation:none}
.rbar.out{animation:rbOut .2s var(--ease) forwards;pointer-events:none}
.rbar input{margin:0;min-width:0;padding:5px 9px;font-size:14px;min-height:0;height:32px}
.rbar .rn{flex:0 0 5.2em;width:5.2em}
.rbar .rt{flex:1}
.rbar .primary{padding:0 14px;font-size:14px;flex:none;min-height:0;height:32px}
@keyframes rbIn{from{opacity:0;transform:translateX(30px) scaleX(.6)}to{opacity:1;transform:none}}
@keyframes rbOut{to{opacity:0;transform:translateX(30px) scaleX(.6)}}
.foot{position:relative;min-height:34px}
.foot .fr{margin-left:auto;display:flex;align-items:center;gap:8px}
.foot .fr .del{margin-left:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.foot .del{margin-left:auto}
.foot.end{justify-content:flex-end;gap:8px}
.foot.end .del{margin-left:0}
.ed{min-height:34px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:3px 12px;font-size:14px;cursor:pointer;transition:background .2s,transform .12s}
.ed:active{transform:scale(.95)}
@media(hover:hover){.ed:hover{background:#f1eee5}}
.del{min-height:34px;background:transparent;border:0;border-radius:8px;color:var(--del);padding:3px 12px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,transform .12s}
.del.sm{min-height:30px;padding:0 8px;font-size:13px}
@media(hover:hover){.del:hover{background:rgba(140,28,28,.09)}}
.err{color:var(--bad)}
.sk i{display:block;height:14px;border-radius:7px;background:#e4e0d4;margin:10px 0;animation:pulse 1.2s ease-in-out infinite}
.sk i.s{width:55%}

/* 弹窗与提示 */
.ov{position:fixed;inset:0;background:rgba(30,32,36,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fade .2s}
.ov.out{opacity:0;transition:opacity .2s;pointer-events:none}
.modal{width:100%;max-width:380px;animation:modalIn .35s var(--spring)}
.ov.out .modal{transform:scale(.95);transition:transform .2s}
.ov.bottom{align-items:flex-end;padding:0}
.sheet{display:flex;flex-direction:column;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:hidden;border-radius:18px 18px 0 0;border-bottom:0;animation:sheetIn .45s var(--spring)}
.ov.out .sheet{transform:translateY(50px);opacity:0;transition:transform .22s,opacity .2s}
.sheet-h{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 12px 10px 22px;border-bottom:1px solid var(--line);box-shadow:0 8px 14px -8px rgba(40,40,30,.4)}
.sheet-h h2{font-size:22px;margin:0}
.x{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;transition:background .2s,transform .12s}
.x:active{transform:scale(.9)}
.sheet-b{padding:16px 22px 4px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#f4f2ea}
@media(min-width:641px){
  .ov.bottom{align-items:center;padding:20px}
  .sheet{border-radius:14px;border-bottom:1px solid var(--line);max-height:min(88vh,760px)}
  .sheet-f{padding-bottom:14px}
  .tb{flex-wrap:wrap;overflow:visible}
}
@media(hover:hover){.x:hover{background:rgba(40,40,30,.07)}}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px rgba(35,74,78,.45),0 2px 4px rgba(0,0,0,.2);animation:fabIn .6s .35s var(--spring) backwards;transition:transform .2s var(--spring),box-shadow .2s}

<body>

<script>
/* ===== CONFIG_START ===== */
const CONFIG = {
  "owner": "blagru",
  "repo": "411",
  "branch": "main",
  "path": "data.json",
  "enc": {
    "student": "I9L3j2NRUS6p0vFENpXJe+wqxtL44KdjPP25MB5E0eBLr2wG4qcYWDtomhOnI1araPpkB1zgRcu8FB8bmLBblzlhDlKADW0270vPb/FjZeaJ/S2/j83rmKnx3JA4DilPeA9GaAjwHzih9gpdO3yoe18kyPFf9L9DFzePEXMPKU5i8k2opCuDyIw=",
    "monitor": "ffW0+8qN76oGJgQUmJO+fuYI9qZeEBqgOVgS/mLqVQ8HltADsAJqSu/QgkH/TEuSaFt2bj/ngcbPqPn7SpPllkYg3pzGkNrW4WMzpuSRJt7sQVw92uTB5IoCBaIGF2u87via4twQlHx+VlEvn7fPzpnf81OzxEPVqn2QGHwh8kRGLCTbD9ylUHQ=",
    "principal": "qLPihmxbvFf8L3TLkdzxaEwlLPgjhhNnZxLnLuFYsnWGXzecp0sqRUmeImrySZl3HbFO9w+0WUlR6aGJtwT25uyuZXOZqPuDBNFfyIfcItc2J8dL1eg5F4jFklwj4xuLVE4+mBwc8eQz0AnDAoniv6uplDmKNEnKkiX3hWU6xlNOsM3F2MVTgT0="
  }
};
/* ===== CONFIG_END ===== */

const CATS = ['食堂','教学','制度','宿舍','设施','活动','其他'];
const NAMES = {student:'学生',monitor:'班长',principal:'校长'};
const TABS = {
  student:[['public','◎ 公开的'],['mine','▣ 我已发布的']],
  monitor:[['main','全部建议']],
  principal:[['main','待阅建议']]
};
const S = {role:null, token:'', data:{posts:[],notices:[]}, sha:null, tab:'', filter:'全部', err:'', loaded:false};
let busy = false;
let seen = new Set();      // 已经播放过入场动画的帖子，避免刷新时重复闪动
let justVoted = null;      // 刚刚投票的帖子，用于播放弹跳动画
let seenN = new Set();     // 已播放过入场动画的通知
let replyId = null;        // 正在评论的帖子
const rdraft = {};         // 未发送的评论草稿
const openC = new Set();   // 已展开全部评论的帖子
const openN = new Set();   // 已展开的长通知
let nDraft = null;         // 通知草稿
let rteRange = null;       // 编辑器里最近的选区

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = t => { const d = new Date(t); return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DEV = (() => { try { let d = localStorage.getItem('dev'); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : uid()); localStorage.setItem('dev', d); } return d; } catch { return 'x' + uid(); } })();
const getMine = () => { try { return JSON.parse(localStorage.getItem('mine') || '[]'); } catch { return []; } };
const addMine = id => { try { localStorage.setItem('mine', JSON.stringify([...getMine(), id])); } catch {} };
const getMineC = () => { try { return JSON.parse(localStorage.getItem('mineC') || '[]'); } catch { return []; } };
const addMineC = id => { try { localStorage.setItem('mineC', JSON.stringify([...getMineC(), id])); } catch {} };
const dropMine = id => { try { localStorage.setItem('mine', JSON.stringify(getMine().filter(x => x !== id))); } catch {} };
let tt;
function toast(m, bad, spin) {
  const t = $('#toast');
  t.innerHTML = (spin ? '<i class="spin"></i>' : '') + '<span></span>';
  t.lastChild.textContent = m;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(tt);
  if (!spin) tt = setTimeout(() => t.className = '', 2800);
}

/* ---------- 弹窗 ---------- */
function openOv(html, onCancel, cls) {
  closeOv(true);
  const ov = document.createElement('div'); ov.className = 'ov' + (cls ? ' ' + cls : ''); ov.id = 'ov'; ov.innerHTML = html; ov._cancel = onCancel;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  ov.addEventListener('pointerdown', e => { if (e.target === ov) closeOv(); });
  return ov;
}
function closeOv(now) {
  const o = $('#ov'); if (!o) return;
  o.removeAttribute('id');
  const c = o._cancel; o._cancel = null; if (c) c();
  document.body.style.overflow = '';
  if (now) { o.remove(); return; }
  o.classList.add('out'); setTimeout(() => o.remove(), 240);
}
function confirmBox(title, msg, okText = '删除') {
  return new Promise(res => {
    const ov = openOv(`<div class="card modal" role="dialog"><h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="row"><button class="ghost" data-x="no">取消</button><button class="danger" data-x="yes">${esc(okText)}</button></div></div>`, () => res(false));
    ov.querySelector('[data-x=no]').onclick = () => closeOv();
    ov.querySelector('[data-x=yes]').onclick = () => { ov._cancel = null; closeOv(); res(true); };
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeOv();
  if (e.key === 'Enter' && !e.isComposing && e.target.matches && e.target.matches('input[id^=cm-]')) { e.preventDefault(); const b = e.target.parentNode.querySelector('[data-act=comment]'); if (b) b.click(); }
});

/* ---------- 加密（密码解开访问令牌） ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const bytes2b64 = u => { let s = ''; u.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b642bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = str => bytes2b64(enc.encode(str));
const fromB64 = b => dec.decode(b642bytes(b.replace(/\s/g, '')));
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(text, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text)));
  const out = new Uint8Array(28 + ct.length); out.set(salt, 0); out.set(iv, 16); out.set(ct, 28);
  return bytes2b64(out);
}
async function unseal(blob, pw) {
  const raw = b642bytes(blob);
  const key = await deriveKey(pw, raw.slice(0, 16));
  return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(16, 28)}, key, raw.slice(28)));
}

/* ---------- GitHub API ---------- */
const apiUrl = () => `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
const hdr = () => ({Authorization:`Bearer ${S.token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'});
function httpErr(status, what) {
  if (status === 401) return new Error('访问令牌无效或已过期，请联系管理员更新');
  if (status === 403) return new Error(what + '被拒绝（权限不足或请求过于频繁）');
  return new Error(`${what}失败（${status}）`);
}
async function load() {
  const r = await fetch(`${apiUrl()}?ref=${encodeURIComponent(CONFIG.branch)}&t=${Date.now()}`, {headers:hdr(), cache:'no-store'});
  if (r.status === 404) {
    const rr = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`, {headers:hdr(), cache:'no-store'});
    if (!rr.ok) throw new Error('无法访问数据仓库，请检查仓库名与令牌权限');
    return {data:{posts:[],notices:[]}, sha:null};
  }
  if (!r.ok) throw httpErr(r.status, '读取');
  const j = await r.json();
  return {data:JSON.parse(fromB64(j.content)), sha:j.sha};
}
async function save(data, sha, msg) {
  const body = {message:msg, content:toB64(JSON.stringify(data, null, 1)), branch:CONFIG.branch};
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(), {method:'PUT', headers:{...hdr(), 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!r.ok) throw httpErr(r.status, '写入');
  return (await r.json()).content.sha;
}
/* 读取最新数据 → 修改 → 写回；遇到并发冲突自动重试 */
async function mutate(fn, msg) {
  for (let i = 0; i < 12; i++) {
    if (i) await sleep(250 * i + Math.random() * 400);   // 与其他设备冲突时稍等再试
    const {data, sha} = await load();
    data.posts = data.posts || [];
    data.notices = data.notices || [];
    fn(data);
    try { const ns = await save(data, sha, msg); S.data = data; S.sha = ns; S.loaded = true; S.err = ''; return; }
    catch (e) { if (e.conflict) continue; throw e; }
  }
  throw new Error('保存冲突，请稍后再试');
}
async function refresh() {
  const prev = {sha:S.sha, err:S.err, loaded:S.loaded};
  try { const {data, sha} = await load(); S.data = data; S.sha = sha; S.err = ''; }
  catch (e) { S.err = e.message || '读取失败'; if (/令牌无效/.test(S.err) && S.role) forget(S.role); }
  S.loaded = true;
  const changed = !prev.loaded || prev.sha !== S.sha || prev.err !== S.err;
  if (changed && S.role) renderView();
}
let chain = Promise.resolve(), pending = 0;
/* 操作排队：一个接一个执行，不会因为操作太快而被取消 */
function run(fn, ok) {
  pending++; busy = true;
  toast(pending > 1 ? `排队中，前面还有 ${pending - 1} 个操作…` : '保存中…', false, true);
  const job = chain.then(async () => {
    toast(pending > 1 ? `保存中…（还有 ${pending - 1} 个在排队）` : '保存中…', false, true);
    let good = false;
    try { await fn(); good = true; }
    catch (e) { toast(e.message || '操作失败', true); }
    finally { pending--; if (!pending) busy = false; if (S.role) renderView(); }
    if (good) { if (pending) toast(`保存中…（还有 ${pending} 个在排队）`, false, true); else toast(ok || '已保存 ✓'); }
    return good;
  });
  chain = job.catch(() => {});
  return job;
}

/* ---------- 数据辅助 ---------- */
const votes = p => { const v = Object.values(p.voters || {}); return {up:v.filter(x => x === 'up').length, down:v.filter(x => x === 'down').length}; };
const pf = (d, id) => { const p = d.posts.find(x => x.id === id); if (!p) throw new Error('该建议已不存在'); return p; };
const status = p => p.mode === 'private' ? '⊘ 仅班长可见' : p.toStudents ? '✓ 已公开' : p.toPrincipal ? '→ 已转校长' : '○ 等待班长处理';
function authorOf(p) {
  if (p.mode === 'named') return esc(p.name || '未署名');
  if (p.mode === 'private' && S.role === 'monitor') return p.name ? esc(p.name) : '未署名';
  return '匿名';
}
function passes(p, f) {
  if (f === '全部') return true;
  if (S.role === 'monitor') {
    if (f === '待处理') return !p.toStudents && !p.toPrincipal && p.mode !== 'private';
    if (f === '未分类') return !p.category;
    if (f === '已公开') return p.toStudents || p.toPrincipal;
  }
  if (f === '未分类') return !p.category;
  return p.category === f;
}

/* ---------- 渲染 ---------- */
function render() {
  document.body.classList.toggle('has-fab', (S.role === 'student' || S.role === 'monitor') && location.hash !== '#setup');
  if (location.hash === '#setup') return renderSetup();
  if (!S.role) renderGate(); else renderShell();
}
function renderGate() {
  const R = [['student','🎒','学生','提交并浏览建议'],['monitor','📋','班长','整理并公开建议'],['principal','🏫','校长','查看并评论建议']];
  $('#app').innerHTML = `<div class="gate"><div class="gate-in"><h1>411意见箱</h1><p class="sub">本网页由蒋梓航制作<br>版权没有 侵权不究</p>
  <div class="roles">${R.map((r, i) => `<button class="card role" style="--i:${i}" data-act="pick" data-role="${r[0]}"><span class="ico">${r[1]}</span><b>${r[2]}</b><small>${(getAuth().tokens || {})[r[0]] ? '已验证，点击直接进入' : r[3]}</small></button>`).join('')}</div>
  ${CONFIG.enc.student ? '' : '<p class="hint">尚未完成初始配置</p>'}</div></div>`;
}
function renderShell() {

document.addEventListener('click', e => {
  const c = e.target.closest('[data-cmd]'); if (c) return rteCmd(c.dataset.cmd, c.dataset.val);
  const t = e.target.closest('[data-act]'); if (t && !isForm(t)) act(t.dataset.act, t);
});
document.addEventListener('change', e => { const t = e.target.closest('[data-act]'); if (t && isForm(t)) act(t.dataset.act, t); });
document.addEventListener('change', e => { if (e.target.id === 'imgfile') { const fs = [...e.target.files]; e.target.value = ''; addFiles(fs); } });
document.addEventListener('input', e => {
  if (e.target.id === 'f-text') $('#cnt').textContent = e.target.value.length + ' / 800';
  if (e.target.id === 'rte') rteSync();
});
window.addEventListener('hashchange', () => location.reload());
setInterval(() => {
  if (!S.role || document.hidden || busy || $('#ov')) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  refresh();
}, 30000);

/* ---------- 首次配置页（地址后加 #setup） ---------- */
function renderSetup() {
  $('#app').innerHTML = `<div class="gate"><div class="card setup"><h2>首次配置</h2>
  <ol><li>新建一个<b>私有</b>仓库（勾选 Add a README），专门用来存放数据。</li>
  <li>GitHub → Settings → Developer settings → Fine-grained tokens：只授权这个仓库，Contents 权限选 Read and write。</li>
  <li>填写下方信息并生成，把结果整段替换到 index.html 的 CONFIG 块里。</li></ol>
  <label class="f">GitHub 用户名<input type="text" id="s-owner" value="Blagru"></label>
  <label class="f">数据仓库名<input type="text" id="s-repo" placeholder="例如 school-suggestion-data"></label>
  <label class="f">分支<input type="text" id="s-branch" value="main"></label>
  <label class="f">数据文件路径<input type="text" id="s-path" value="data.json"></label>
  <label class="f">访问令牌（Token）<input type="password" id="s-token" autocomplete="off"></label>
  <label class="f">学生密码<input type="password" id="s-p1" autocomplete="off"></label>
  <label class="f">班长密码<input type="password" id="s-p2" autocomplete="off"></label>
  <label class="f">校长密码<input type="password" id="s-p3" autocomplete="off"></label>
  <button class="primary" data-act="gen">生成配置</button>
  <div class="msg" id="setupMsg"></div>
  <textarea id="out" rows="10" readonly placeholder="生成的 CONFIG 会显示在这里"></textarea>
  <div class="row"><small>令牌已用各身份的密码加密，不会明文出现在代码里。</small><button class="ghost" data-act="copy">复制</button></div></div></div>`;
}
async function genConfig() {
  const v = id => document.getElementById(id).value;
  const cfg = {owner:v('s-owner').trim(), repo:v('s-repo').trim(), branch:v('s-branch').trim() || 'main', path:v('s-path').trim() || 'data.json'};
  const token = v('s-token').trim(), pws = {student:v('s-p1'), monitor:v('s-p2'), principal:v('s-p3')};
  const msg = $('#setupMsg');
  if (!cfg.owner || !cfg.repo || !token || !pws.student || !pws.monitor || !pws.principal) { msg.textContent = '请把所有项目都填完整'; return; }
  msg.textContent = '正在测试连接并加密…';
  Object.assign(CONFIG, cfg); S.token = token;
  let test = '';
  try { await load(); test = '✓ 已成功连接到数据仓库。'; } catch (e) { test = '! 连接测试未通过：' + e.message + '（仍可生成配置）。'; }
  cfg.enc = {};
  for (const r in pws) cfg.enc[r] = await seal(token, pws[r]);
  $('#out').value = 'const CONFIG = ' + JSON.stringify(cfg, null, 2) + ';';
  msg.textContent = test + ' 请复制下方内容替换 index.html 中的 CONFIG 块。';
}

/* ---------- 启动 ---------- */
(function boot() {
  if (location.hash !== '#setup') {
    const a = getAuth(), tk = a.tokens && a.tokens[a.last];
    if (a.last && tk && TABS[a.last]) { S.role = a.last; S.token = tk; S.tab = TABS[a.last][0][0]; }
  }
  render();
  if (S.role) refresh();
})();
</script>
</body>
</html>
