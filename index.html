<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>411班意见箱</title>
<style>
:root{--bg:#ecebe5;--paper:#fbfaf6;--ink:#24282d;--muted:#6c7178;--line:#d8d4c8;--accent:#2f5d62;--accent-d:#234a4e;--ok:#2f6f4b;--bad:#a4442f;
--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2 0 0 0 0 .2 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);background:var(--bg) var(--noise)}
h1,h2,h3,.brand{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 0 #fff inset,0 1px 2px rgba(40,40,30,.08),0 10px 24px -14px rgba(40,40,30,.35)}
.muted,small{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin-top:32px}

/* 身份选择 */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
.gate-in{width:100%;max-width:860px;text-align:center}
.gate h1{font-size:40px;letter-spacing:.2em}
.sub{color:var(--muted);margin:10px 0 36px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.role{cursor:pointer;padding:38px 18px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:transform .15s,box-shadow .15s}
.role:hover{transform:translateY(-3px);box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(40,40,30,.1),0 16px 28px -14px rgba(40,40,30,.45)}
.role .ico{font-size:42px;line-height:1}
.role b{font-size:21px;font-family:"Songti SC","Noto Serif SC",serif;letter-spacing:.1em}
.role small{font-size:14px}
@media(max-width:640px){.roles{grid-template-columns:1fr}.gate h1{font-size:32px}}

/* 顶栏与布局 */
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:#2b3035 var(--noise);color:#f1efe8;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.brand{font-size:20px;letter-spacing:.15em}
.who{display:flex;align-items:center;gap:8px}
.badge{background:#d9b45a;color:#3a2e0b;border-radius:999px;padding:2px 12px;font-size:13px;margin-right:4px}
.wrap{max-width:780px;margin:0 auto;padding:22px 16px 80px}
#tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab,.chip{border:1px solid var(--line);background:var(--paper);padding:7px 16px;border-radius:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip{padding:3px 12px;font-size:14px;border-radius:999px}
.tab.on,.chip.on{background:var(--accent);color:#fff;border-color:var(--accent-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
.bar .ghost{color:#e9e6dc;border-color:#585e65}
.bar .ghost:hover{background:#3a4047}
.primary{background:var(--accent);color:#fff;border:1px solid var(--accent-d);border-radius:8px;padding:9px 22px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 4px rgba(0,0,0,.18)}
.primary:active{transform:translateY(1px);box-shadow:none}
.primary:disabled{opacity:.6}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.summary{color:var(--muted);font-size:14px;margin-bottom:12px}

/* 表单 */
.post,.form,.modal,.setup{padding:20px 22px}
.post{margin-bottom:16px}
.form h2,.setup h2,.modal h2{font-size:22px;margin-bottom:14px}
label.f{display:block;margin-bottom:14px;font-weight:600}
label.f small{font-weight:400}
input[type=text],input[type=password],select,textarea{width:100%;padding:9px 12px;border:1px solid #cbc6b8;border-radius:8px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06) inset;margin-top:6px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(47,93,98,.35);border-color:var(--accent)}
textarea{resize:vertical}
input[type=radio],input[type=checkbox]{width:auto;margin:0;box-shadow:none}
.mode{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;margin-bottom:8px;font-weight:400}
.mode:has(input:checked){border-color:var(--accent);background:#eaf1f0}
.mode input{margin-top:6px}
.mode b{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}

/* 帖子 */
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:14px;margin-bottom:8px}
.meta .grow{flex:1}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:13px;background:#f1eee5;color:#4b4f55}
.tag.empty{color:#9a9a90;border-style:dashed}
.tag.lock{background:#f3e3df;color:var(--bad);border-color:#e2bdb4}
.tag.ok{background:#e2efe6;color:var(--ok);border-color:#b9d6c4}
.content{white-space:pre-wrap;word-break:break-word}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px;padding:12px 14px;background:#f1eee5;border:1px solid var(--line);border-radius:8px;font-size:15px}
.ctrl select{width:auto;margin:0 0 0 6px;padding:4px 10px}
.sw{display:flex;gap:6px;align-items:center;cursor:pointer}
.votes{display:flex;gap:10px;margin-top:14px;align-items:center}
.vote{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.vote:disabled{cursor:default;opacity:.55}
.vote.on-up{background:#e2efe6;border-color:#7fae92;color:var(--ok);opacity:1}
.vote.on-down{background:#f5e4df;border-color:#c9887a;color:var(--bad);opacity:1}
.votes.ro span{padding:4px 12px;background:#f1eee5;border-radius:8px;font-size:14px}
.cm{margin-top:12px;padding:10px 14px;border-left:3px solid var(--accent);background:#eaf0ee;border-radius:0 8px 8px 0}
.cm-h{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.cm p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.cm-form{margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.cm-form textarea{margin:0}
.err{color:var(--bad)}

/* 弹窗与提示 */
.ov{position:fixed;inset:0;background:rgba(30,32,36,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{width:100%;max-width:360px}
.modal .row{justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#2b3035;color:#fff;padding:10px 20px;border-radius:10px;transition:.2s;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--bad)}
.setup{max-width:640px;width:100%}
.setup ol{padding-left:20px;color:var(--muted);font-size:14px}
.setup textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.msg{font-size:14px;margin:10px 0;min-height:22px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ===== CONFIG_START（用 #setup 页面生成后，整段替换） ===== */
const CONFIG = {
  "owner": "blagru",
  "repo": "411",
  "branch": "main",
  "path": "data.json",
  "enc": {
    "student": "I9L3j2NRUS6p0vFENpXJe+wqxtL44KdjPP25MB5E0eBLr2wG4qcYWDtomhOnI1araPpkB1zgRcu8FB8bmLBblzlhDlKADW0270vPb/FjZeaJ/S2/j83rmKnx3JA4DilPeA9GaAjwHzih9gpdO3yoe18kyPFf9L9DFzePEXMPKU5i8k2opCuDyIw=",
    "monitor": "ffW0+8qN76oGJgQUmJO+fuYI9qZeEBqgOVgS/mLqVQ8HltADsAJqSu/QgkH/TEuSaFt2bj/ngcbPqPn7SpPllkYg3pzGkNrW4WMzpuSRJt7sQVw92uTB5IoCBaIGF2u87via4twQlHx+VlEvn7fPzpnf81OzxEPVqn2QGHwh8kRGLCTbD9ylUHQ=",
    "principal": "qLPihmxbvFf8L3TLkdzxaEwlLPgjhhNnZxLnLuFYsnWGXzecp0sqRUmeImrySZl3HbFO9w+0WUlR6aGJtwT25uyuZXOZqPuDBNFfyIfcItc2J8dL1eg5F4jFklwj4xuLVE4+mBwc8eQz0AnDAoniv6uplDmKNEnKkiX3hWU6xlNOsM3F2MVTgT0="
  }
};
/* ===== CONFIG_END ===== */

const CATS = ['食堂','教学','制度','宿舍','设施','活动','其他'];
const NAMES = {student:'学生',monitor:'班长',principal:'校长'};
const TABS = {
  student:[['submit','✍️ 提交建议'],['public','📢 公开建议'],['mine','📁 我的建议']],
  monitor:[['main','全部建议']],
  principal:[['main','待阅建议']]
};
const S = {role:null, token:'', data:{posts:[]}, sha:null, tab:'', filter:'全部', err:'', loaded:false};
let busy = false;

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = t => { const d = new Date(t); return `${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const DEV = (() => { try { let d = localStorage.getItem('dev'); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : uid()); localStorage.setItem('dev', d); } return d; } catch { return 'x' + uid(); } })();
const getMine = () => { try { return JSON.parse(localStorage.getItem('mine') || '[]'); } catch { return []; } };
const addMine = id => { try { localStorage.setItem('mine', JSON.stringify([...getMine(), id])); } catch {} };
let tt;
function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(tt); tt = setTimeout(() => t.className = '', 2800); }

/* ---------- 加密（密码解开访问令牌） ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const bytes2b64 = u => { let s = ''; u.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
const b642bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = str => bytes2b64(enc.encode(str));
const fromB64 = b => dec.decode(b642bytes(b.replace(/\s/g, '')));
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function seal(text, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text)));
  const out = new Uint8Array(28 + ct.length); out.set(salt, 0); out.set(iv, 16); out.set(ct, 28);
  return bytes2b64(out);
}
async function unseal(blob, pw) {
  const raw = b642bytes(blob);
  const key = await deriveKey(pw, raw.slice(0, 16));
  return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(16, 28)}, key, raw.slice(28)));
}

/* ---------- GitHub API ---------- */
const apiUrl = () => `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
const hdr = () => ({Authorization:`Bearer ${S.token}`, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'});
function httpErr(status, what) {
  if (status === 401) return new Error('访问令牌无效或已过期，请联系管理员更新');
  if (status === 403) return new Error(what + '被拒绝（权限不足或请求过于频繁）');
  return new Error(`${what}失败（${status}）`);
}
async function load() {
  const r = await fetch(`${apiUrl()}?ref=${encodeURIComponent(CONFIG.branch)}&t=${Date.now()}`, {headers:hdr(), cache:'no-store'});
  if (r.status === 404) {
    const rr = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`, {headers:hdr(), cache:'no-store'});
    if (!rr.ok) throw new Error('无法访问数据仓库，请检查仓库名与令牌权限');
    return {data:{posts:[]}, sha:null};
  }
  if (!r.ok) throw httpErr(r.status, '读取');
  const j = await r.json();
  return {data:JSON.parse(fromB64(j.content)), sha:j.sha};
}
async function save(data, sha, msg) {
  const body = {message:msg, content:toB64(JSON.stringify(data, null, 1)), branch:CONFIG.branch};
  if (sha) body.sha = sha;
  const r = await fetch(apiUrl(), {method:'PUT', headers:{...hdr(), 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (r.status === 409 || r.status === 422) { const e = new Error('conflict'); e.conflict = true; throw e; }
  if (!r.ok) throw httpErr(r.status, '写入');
  return (await r.json()).content.sha;
}
/* 读取最新数据 → 修改 → 写回；遇到并发冲突自动重试 */
async function mutate(fn, msg) {
  for (let i = 0; i < 4; i++) {
    const {data, sha} = await load();
    data.posts = data.posts || [];
    fn(data);
    try { const ns = await save(data, sha, msg); S.data = data; S.sha = ns; S.loaded = true; S.err = ''; return; }
    catch (e) { if (e.conflict) continue; throw e; }
  }
  throw new Error('保存冲突，请稍后再试');
}
async function refresh() {
  try { const {data, sha} = await load(); S.data = data; S.sha = sha; S.err = ''; }
  catch (e) { S.err = e.message || '读取失败'; }
  S.loaded = true;
  if (S.role && !(S.role === 'student' && S.tab === 'submit')) renderView();
}
async function run(fn, ok) {
  if (busy) { toast('稍等，正在处理上一个操作…', true); return false; }
  busy = true; toast('保存中…');
  let good = false;
  try { await fn(); toast(ok || '已保存 ✓'); good = true; }
  catch (e) { toast(e.message || '操作失败', true); }
  finally { busy = false; if (S.role && !(S.role === 'student' && S.tab === 'submit')) renderView(); }
  return good;
}

/* ---------- 数据辅助 ---------- */
const votes = p => { const v = Object.values(p.voters || {}); return {up:v.filter(x => x === 'up').length, down:v.filter(x => x === 'down').length}; };
const pf = (d, id) => { const p = d.posts.find(x => x.id === id); if (!p) throw new Error('该建议已不存在'); return p; };
const status = p => p.mode === 'private' ? '🔒 仅班长可见' : p.toStudents ? '✅ 已公开' : p.toPrincipal ? '📨 已转校长' : '⏳ 等待班长处理';
function authorOf(p) {
  if (p.mode === 'named') return esc(p.name || '未署名');
  if (p.mode === 'private' && S.role === 'monitor') return p.name ? esc(p.name) : '未署名';
  return '匿名';
}
function passes(p, f) {
  if (f === '全部') return true;
  if (S.role === 'monitor') {
    if (f === '待处理') return !p.toStudents && !p.toPrincipal && p.mode !== 'private';
    if (f === '未分类') return !p.category;
    if (f === '已公开') return p.toStudents || p.toPrincipal;
  }
  if (f === '未分类') return !p.category;
  return p.category === f;
}

/* ---------- 渲染 ---------- */
function render() {
  if (location.hash === '#setup') return renderSetup();
  if (!S.role) renderGate(); else renderShell();
}
function renderGate() {
  const R = [['student','🎒','学生','提交并浏览建议'],['monitor','📋','班长','整理并公开建议'],['principal','🏫','校长','查看并回复建议']];
  $('#app').innerHTML = `<div class="gate"><div class="gate-in"><h1>411班意见箱</h1><p class="sub">本网页由蒋梓航制作<br>版权没有 侵权不究</p>
  <div class="roles">${R.map(r => `<button class="card role" data-act="pick" data-role="${r[0]}"><span class="ico">${r[1]}</span><b>${r[2]}</b><small>${r[3]}</small></button>`).join('')}</div>
  ${CONFIG.enc.student ? '' : '<p class="hint">尚未完成初始配置</p>'}</div></div>`;
}
function renderShell() {
  $('#app').innerHTML = `<header class="bar"><div class="brand">411班意见箱</div><div class="who"><span class="badge">${NAMES[S.role]}</span><button class="ghost" data-act="refresh">刷新</button><button class="ghost" data-act="switch">切换身份</button></div></header><main class="wrap"><nav id="tabs"></nav><div id="view"></div></main>`;
  renderTabs(); renderView();
}
function renderTabs() {
  const t = $('#tabs'); if (!t) return;
  const list = TABS[S.role];
  t.innerHTML = list.length < 2 ? '' : list.map(x => `<button class="tab${S.tab === x[0] ? ' on' : ''}" data-act="tab" data-v="${x[0]}">${x[1]}</button>`).join('');
}
function renderView() {
  const v = $('#view'); if (!v) return;
  const keep = {}; v.querySelectorAll('textarea[id]').forEach(x => keep[x.id] = x.value);
  v.innerHTML = viewHTML();
  for (const k in keep) { const x = document.getElementById(k); if (x) x.value = keep[k]; }
}
function formHTML() {
  return `<div class="card form"><h2>提交建议</h2>
  <label class="f">类别 <small>（可不选，由班长分配）</small><select id="f-cat"><option value="">（不选择）</option>${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
  <div class="f" style="font-weight:600;margin-bottom:6px">上报方式</div>
  <label class="mode"><input type="radio" name="mode" value="anon" data-act="mode" checked><span><b>匿名上报</b><small>不记录姓名，公开后显示为“匿名”</small></span></label>
  <label class="mode"><input type="radio" name="mode" value="named" data-act="mode"><span><b>署名上报</b><small>公开后会显示你填写的署名</small></span></label>
  <label class="mode"><input type="radio" name="mode" value="private" data-act="mode"><span><b>不公开上报</b><small>仅班长可见，不会被公开给任何人</small></span></label>
  <label class="f" id="nameRow" hidden><span id="nameLbl">署名</span><input type="text" id="f-name" maxlength="20" placeholder="署名"></label>
  <label class="f">你的意见或建议<textarea id="f-text" rows="6" maxlength="800" placeholder="请写下你想对校长说的话（至少 5 个字）"></textarea></label>
  <div class="row"><small id="cnt">0 / 800</small><button class="primary" data-act="submit">提交</button></div></div>`;
}
function viewHTML() {
  if (S.role === 'student' && S.tab === 'submit') return formHTML();
  if (!S.loaded) return '<p class="empty">加载中…</p>';
  if (S.err) return `<div class="card post err">⚠️ ${esc(S.err)}</div>`;
  let list = [...(S.data.posts || [])].sort((a, b) => b.time - a.time);
  if (S.role === 'student') list = S.tab === 'mine' ? list.filter(p => getMine().includes(p.id)) : list.filter(p => p.toStudents && p.mode !== 'private');
  if (S.role === 'principal') list = list.filter(p => p.toPrincipal);
  const opts = S.role === 'monitor' ? ['全部','待处理','未分类','已公开'] : ['全部', ...new Set(list.map(p => p.category || '未分类'))];
  if (!opts.includes(S.filter)) S.filter = '全部';
  const shown = list.filter(p => passes(p, S.filter));
  const showChips = S.role === 'monitor' || (S.tab !== 'mine' && list.length > 0 && opts.length > 2);
  let head = '';
  if (S.role === 'monitor') head = `<div class="summary">共 ${list.length} 条，其中待处理 ${list.filter(p => passes(p, '待处理')).length} 条</div>`;
  const chips = showChips ? `<div class="chips">${opts.map(o => `<button class="chip${S.filter === o ? ' on' : ''}" data-act="filter" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : '';
  const emptyMsg = {student: S.tab === 'mine' ? '你还没有提交过建议' : '还没有公开的建议', monitor:'还没有同学提交建议', principal:'班长还没有向你公开建议'}[S.role];
  return head + chips + (shown.length ? shown.map(card).join('') : `<p class="empty">${emptyMsg}</p>`);
}
function card(p) {
  const r = S.role, v = votes(p), my = (p.voters || {})[DEV];
  const canVote = r === 'student' && p.toStudents && p.mode !== 'private';
  const tags = [`<span class="tag${p.category ? '' : ' empty'}">${p.category ? esc(p.category) : '未分类'}</span>`];
  if (r === 'monitor') {
    if (p.mode === 'private') tags.push('<span class="tag lock">🔒 仅班长可见</span>');
    if (p.toStudents) tags.push('<span class="tag ok">学生可见</span>');
    if (p.toPrincipal) tags.push('<span class="tag ok">校长可见</span>');
  }
  if (r === 'student' && S.tab === 'mine') tags.push(`<span class="tag">${status(p)}</span>`);
  let ctrl = '';
  if (r === 'monitor') {
    const priv = p.mode === 'private';
    ctrl = `<div class="ctrl"><label>类别<select data-act="cat" data-id="${p.id}"><option value="">未分类</option>${CATS.map(c => `<option${p.category === c ? ' selected' : ''}>${c}</option>`).join('')}</select></label>
    <label class="sw"><input type="checkbox" data-act="toS" data-id="${p.id}"${p.toStudents ? ' checked' : ''}${priv ? ' disabled' : ''}> 公开给学生</label>
    <label class="sw"><input type="checkbox" data-act="toP" data-id="${p.id}"${p.toPrincipal ? ' checked' : ''}${priv ? ' disabled' : ''}> 公开给校长</label>
    ${priv ? '<small>提交者选择了“仅班长可见”，不可公开</small>' : ''}</div>`;
  }
  let vt = '';
  if (canVote) vt = `<div class="votes"><button class="vote${my === 'up' ? ' on-up' : ''}" data-act="vote" data-id="${p.id}" data-v="up"${my ? ' disabled' : ''}>👍 赞成 ${v.up}</button><button class="vote${my === 'down' ? ' on-down' : ''}" data-act="vote" data-id="${p.id}" data-v="down"${my ? ' disabled' : ''}>👎 反对 ${v.down}</button>${my ? '<small>你已投过票</small>' : ''}</div>`;
  else if (r !== 'student' && (p.toStudents || r === 'principal')) vt = `<div class="votes ro"><span>👍 ${v.up}</span><span>👎 ${v.down}</span></div>`;
  const cms = (p.comments || []).map(c => `<div class="cm"><div class="cm-h"><b>校长回复</b><span>${fmt(c.time)}</span></div><p>${esc(c.text)}</p></div>`).join('');
  const form = r === 'principal' ? `<div class="cm-form"><textarea id="cm-${p.id}" rows="2" maxlength="500" placeholder="写下校长的回复…"></textarea><button class="primary" data-act="comment" data-id="${p.id}">发表评论</button></div>` : '';
  return `<article class="card post"><div class="meta">${tags.join('')}<span class="grow"></span><span>${authorOf(p)} · ${fmt(p.time)}</span></div><div class="content">${esc(p.content)}</div>${ctrl}${vt}${cms}${form}</article>`;
}

/* ---------- 登录 ---------- */
function askPw(role) {
  const icons = {student:'🎒', monitor:'📋', principal:'🏫'};
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = `<form class="card modal"><h2>${icons[role]} 我是${NAMES[role]}</h2><input type="password" id="pw" placeholder="请输入密码" autocomplete="off"><div class="row"><button type="button" class="ghost" data-act="close">取消</button><button class="primary" type="submit">进入</button></div></form>`;
  document.body.appendChild(ov);
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeOv(); });
  ov.querySelector('form').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.submitter; btn.disabled = true;
    await login(role, $('#pw').value);
    btn.disabled = false;
  };
  setTimeout(() => $('#pw') && $('#pw').focus(), 30);
}
const closeOv = () => { const o = $('#ov'); if (o) o.remove(); };
async function login(role, pw) {
  if (!CONFIG.enc[role] || !CONFIG.owner || !CONFIG.repo) return toast('尚未完成初始配置，请先打开 #setup 页面', true);
  let token;
  try { token = await unseal(CONFIG.enc[role], pw); } catch { return toast('密码不对哦 🙈', true); }
  S.role = role; S.token = token; S.tab = TABS[role][0][0]; S.filter = '全部'; S.loaded = false;
  try { sessionStorage.setItem('sess', JSON.stringify({role, token})); } catch {}
  closeOv(); render(); refresh();
}

/* ---------- 提交建议 ---------- */
async function submitPost() {
  const text = $('#f-text').value.trim(), cat = $('#f-cat').value, mode = document.querySelector('input[name=mode]:checked').value, name = $('#f-name').value.trim();
  if (text.length < 5) return toast('内容至少写 5 个字哦', true);
  if (mode === 'named' && !name) return toast('选择署名上报时请填写署名', true);
  const post = {id:uid(), time:Date.now(), category:cat, content:text, mode, name:mode === 'anon' ? '' : name, toStudents:false, toPrincipal:false, voters:{}, comments:[]};
  const ok = await run(() => mutate(d => { d.posts.push(post); }, '新增一条建议'), '提交成功，谢谢你的建议 🎉');
  if (ok) { addMine(post.id); S.tab = 'mine'; S.filter = '全部'; renderTabs(); renderView(); }
}

/* ---------- 事件 ---------- */
function act(a, t) {
  const id = t.dataset.id;
  switch (a) {
    case 'pick': return askPw(t.dataset.role);
    case 'close': return closeOv();
    case 'switch': try { sessionStorage.removeItem('sess'); } catch {} S.role = null; S.token = ''; S.data = {posts:[]}; S.loaded = false; return render();
    case 'refresh': return (async () => { toast('刷新中…'); await refresh(); toast(S.err || '已刷新 ✓', !!S.err); })();
    case 'tab': S.tab = t.dataset.v; S.filter = '全部'; renderTabs(); renderView(); if (S.tab !== 'submit') refresh(); return;
    case 'filter': S.filter = t.dataset.v; return renderView();
    case 'mode': { const m = t.value; $('#nameRow').hidden = m === 'anon'; $('#nameLbl').textContent = m === 'named' ? '署名（必填）' : '称呼（选填，方便班长联系你）'; return; }
    case 'submit': return submitPost();
    case 'vote': { const val = t.dataset.v; return run(() => mutate(d => { const p = pf(d, id); p.voters = p.voters || {}; if (p.voters[DEV]) throw new Error('你已经投过票了'); p.voters[DEV] = val; }, '投票'), '投票成功 ✓'); }
    case 'cat': { const val = t.value; return run(() => mutate(d => { pf(d, id).category = val; }, '调整建议类别'), '类别已更新 ✓'); }
    case 'toS': { const val = t.checked; return run(() => mutate(d => { const p = pf(d, id); if (p.mode === 'private') throw new Error('该条仅班长可见，不能公开'); p.toStudents = val; }, val ? '公开给学生' : '取消公开给学生'), val ? '已公开给学生 ✓' : '已取消公开 ✓'); }
    case 'toP': { const val = t.checked; return run(() => mutate(d => { const p = pf(d, id); if (p.mode === 'private') throw new Error('该条仅班长可见，不能公开'); p.toPrincipal = val; }, val ? '公开给校长' : '取消公开给校长'), val ? '已公开给校长 ✓' : '已取消公开 ✓'); }
    case 'comment': {
      const ta = document.getElementById('cm-' + id), text = ta.value.trim();
      if (!text) return toast('评论不能为空', true);
      return run(() => mutate(d => { const p = pf(d, id); if (!p.toPrincipal) throw new Error('该条已不再公开给校长'); (p.comments = p.comments || []).push({id:uid(), time:Date.now(), text}); }, '校长发表评论'), '评论已发布 ✓')
        .then(ok => { if (ok) { const x = document.getElementById('cm-' + id); if (x) x.value = ''; } });
    }
    case 'gen': return genConfig();
    case 'copy': { const o = $('#out'); if (!o.value) return; navigator.clipboard.writeText(o.value).then(() => toast('已复制 ✓'), () => { o.select(); toast('请手动复制', true); }); return; }
  }
}
const isForm = t => t.tagName === 'SELECT' || t.type === 'checkbox' || t.type === 'radio';
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t && !isForm(t)) act(t.dataset.act, t); });
document.addEventListener('change', e => { const t = e.target.closest('[data-act]'); if (t && isForm(t)) act(t.dataset.act, t); });
document.addEventListener('input', e => { if (e.target.id === 'f-text') $('#cnt').textContent = e.target.value.length + ' / 800'; });
window.addEventListener('hashchange', () => location.reload());
setInterval(() => {
  if (!S.role || document.hidden || busy) return;
  const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  refresh();
}, 30000);

/* ---------- 首次配置页（地址后加 #setup） ---------- */
function renderSetup() {
  $('#app').innerHTML = `<div class="gate"><div class="card setup"><h2>⚙️ 首次配置</h2>
  <ol><li>新建一个<b>私有</b>仓库（勾选 Add a README），专门用来存放数据。</li>
  <li>GitHub → Settings → Developer settings → Fine-grained tokens：只授权这个仓库，Contents 权限选 Read and write。</li>
  <li>填写下方信息并生成，把结果整段替换到 index.html 的 CONFIG 块里。</li></ol>
  <label class="f">GitHub 用户名<input type="text" id="s-owner" value="Blagru"></label>
  <label class="f">数据仓库名<input type="text" id="s-repo" placeholder="例如 school-suggestion-data"></label>
  <label class="f">分支<input type="text" id="s-branch" value="main"></label>
  <label class="f">数据文件路径<input type="text" id="s-path" value="data.json"></label>
  <label class="f">访问令牌（Token）<input type="password" id="s-token" autocomplete="off"></label>
  <label class="f">学生密码<input type="password" id="s-p1" autocomplete="off"></label>
  <label class="f">班长密码<input type="password" id="s-p2" autocomplete="off"></label>
  <label class="f">校长密码<input type="password" id="s-p3" autocomplete="off"></label>
  <button class="primary" data-act="gen">生成配置</button>
  <div class="msg" id="setupMsg"></div>
  <textarea id="out" rows="10" readonly placeholder="生成的 CONFIG 会显示在这里"></textarea>
  <div class="row"><small>令牌已用各身份的密码加密，不会明文出现在代码里。</small><button class="ghost" data-act="copy">复制</button></div></div></div>`;
}
async function genConfig() {
  const v = id => document.getElementById(id).value;
  const cfg = {owner:v('s-owner').trim(), repo:v('s-repo').trim(), branch:v('s-branch').trim() || 'main', path:v('s-path').trim() || 'data.json'};
  const token = v('s-token').trim(), pws = {student:v('s-p1'), monitor:v('s-p2'), principal:v('s-p3')};
  const msg = $('#setupMsg');
  if (!cfg.owner || !cfg.repo || !token || !pws.student || !pws.monitor || !pws.principal) { msg.textContent = '⚠️ 请把所有项目都填完整'; return; }
  msg.textContent = '正在测试连接并加密…';
  Object.assign(CONFIG, cfg); S.token = token;
  let test = '';
  try { await load(); test = '✅ 已成功连接到数据仓库。'; } catch (e) { test = '⚠️ 连接测试未通过：' + e.message + '（仍可生成配置）。'; }
  cfg.enc = {};
  for (const r in pws) cfg.enc[r] = await seal(token, pws[r]);
  $('#out').value = 'const CONFIG = ' + JSON.stringify(cfg, null, 2) + ';';
  msg.textContent = test + ' 请复制下方内容替换 index.html 中的 CONFIG 块。';
}

/* ---------- 启动 ---------- */
(function boot() {
  if (location.hash !== '#setup') {
    try { const s = JSON.parse(sessionStorage.getItem('sess') || 'null'); if (s && s.role && s.token && TABS[s.role]) { S.role = s.role; S.token = s.token; S.tab = TABS[s.role][0][0]; } } catch {}
  }
  render();
  if (S.role) refresh();
})();
</script>
</body>
